services:
  app:
    build: .
    container_name: fe_utilities_app
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: mysite.settings.prod
    volumes:
      # Written by the entrypoint's collectstatic, read by nginx.
      - static:/app/staticfiles
    # Not published: nginx is the only way in.
    expose:
      - "8000"

  nginx:
    image: nginx:1.27-alpine
    container_name: fe_utilities_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static:/var/www/static:ro
    depends_on:
      app:
        condition: service_healthy

volumes:
  static:
