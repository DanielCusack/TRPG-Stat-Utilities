upstream app {
    server app:8000;
}

server {
    listen 80;

    # Once a domain exists, set server_name and add a TLS listener here.
    server_name _;

    # Django/uvicorn never sees static requests, which avoids WhiteNoise
    # buffering whole files through sync_to_async under ASGI.
    location /static/ {
        alias /var/www/static/;

        # Serve the pre-compressed .gz files produced by
        # CompressedManifestStaticFilesStorage during collectstatic.
        gzip_static on;

        # Filenames are content-hashed, so they can be cached indefinitely.
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://app;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Read by SECURE_PROXY_SSL_HEADER once TLS terminates here.
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_redirect off;
    }

    client_max_body_size 4m;
}
